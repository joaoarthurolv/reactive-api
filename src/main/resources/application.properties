spring.application.name=reactive-api

# ---------------------------------------------------------------------------
# R2DBC (reactive connection used by the application at runtime)
# ---------------------------------------------------------------------------
spring.r2dbc.url=r2dbc:postgresql://localhost:5433/codechella
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres

# ---------------------------------------------------------------------------
# Flyway (runs migrations over a blocking JDBC connection)
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5433/codechella
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.locations=classpath:db/migration
